# BrightBean on existing Dokploy + Traefik. No Caddy, no host 80/443/5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: brightbean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - brightbean_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightbean"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: https://github.com/brightbeanxyz/brightbean-studio.git#main
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://brightbean:${POSTGRES_PASSWORD}@postgres:5432/brightbean
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: https://github.com/brightbeanxyz/brightbean-studio.git#main
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://brightbean:${POSTGRES_PASSWORD}@postgres:5432/brightbean
    volumes:
      - brightbean_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build: https://github.com/brightbeanxyz/brightbean-studio.git#main
    command: python manage.py process_tasks
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://brightbean:${POSTGRES_PASSWORD}@postgres:5432/brightbean
    volumes:
      - brightbean_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  brightbean_pg:
  brightbean_media:
