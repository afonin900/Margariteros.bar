<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Margariteros — GBP event</title>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("../fonts/Montserrat-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 900px;
        overflow: hidden;
        background: #0b0b0b;
      }

      .poster {
        position: relative;
        width: 1200px;
        height: 900px;
      }

      .hero {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: {{PHOTO_POSITION}};
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.08) 0%,
            rgba(0, 0, 0, 0) 40%,
            rgba(0, 0, 0, 0.58) 78%,
            rgba(0, 0, 0, 0.72) 100%
          );
      }

      .copy {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 56px;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      }

      .dates {
        margin: 0 0 8px;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .dates[hidden] {
        display: none;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 84px;
        font-weight: 900;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      .start {
        margin: 0;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .start[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <article class="poster">
      <img class="hero" src="{{PHOTO_URL}}" alt="" />
      <div class="shade"></div>
      <div class="copy">
        <p class="dates" {{DATES_HIDDEN}}>{{DATES}}</p>
        <h1>{{ARTIST}}</h1>
        <p class="start" {{START_HIDDEN}}>{{START}}</p>
      </div>
    </article>
  </body>
</html>
