<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Margariteros — friday reel</title>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("../fonts/Montserrat-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0b0b;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
      }

      .hero {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: {{PHOTO_POSITION}};
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.18) 0%,
            rgba(0, 0, 0, 0) 22%,
            rgba(0, 0, 0, 0.12) 48%,
            rgba(0, 0, 0, 0.62) 78%,
            rgba(0, 0, 0, 0.78) 100%
          );
      }

      .copy {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 268px;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      }

      .location {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 28px;
        padding: 10px 18px 10px 14px;
        border-radius: 10px;
        background: #fff;
        color: #1a1a1a;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-shadow: none;
      }

      .location[hidden] {
        display: none;
      }

      .pin {
        width: 22px;
        height: 28px;
        flex: 0 0 auto;
      }

      .dates {
        margin: 0 0 10px;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }

      .dates[hidden] {
        display: none;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 132px;
        font-weight: 900;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      .start {
        margin: 0;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .start[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <article class="poster">
      <img class="hero" src="{{PHOTO_URL}}" alt="" />
      <div class="shade"></div>
      <div class="copy">
        <p class="location" {{LOCATION_HIDDEN}}>
          <svg class="pin" viewBox="0 0 24 32" aria-hidden="true">
            <path
              fill="#2b7cff"
              d="M12 0C5.9 0 1 4.8 1 10.8 1 19 12 32 12 32s11-13 11-21.2C23 4.8 18.1 0 12 0z"
            />
            <circle fill="#fff" cx="12" cy="11" r="4.2" />
          </svg>
          {{LOCATION}}
        </p>
        <p class="dates" {{DATES_HIDDEN}}>{{DATES}}</p>
        <h1>{{ARTIST}}</h1>
        <p class="start" {{START_HIDDEN}}>{{START}}</p>
      </div>
    </article>
  </body>
</html>
